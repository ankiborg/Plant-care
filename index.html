<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plant Care</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪴</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <h1>🪴 Plant Care</h1>
    <p class="tagline">Keep your plants happy and hydrated</p>
  </header>

  <main>
    <section class="summary" id="summary" aria-live="polite"></section>

    <section class="add-plant">
      <h2>Add a plant</h2>
      <form id="plant-form">
        <div class="form-row">
          <label>
            Name
            <input type="text" id="plant-name" placeholder="e.g. Monstera in the kitchen" required maxlength="60">
          </label>
          <label>
            Species <span class="optional">(optional)</span>
            <input type="text" id="plant-species" placeholder="e.g. Monstera deliciosa" maxlength="60">
          </label>
        </div>
        <div class="form-row">
          <label>
            Water every
            <span class="interval-input">
              <input type="number" id="plant-interval" min="1" max="90" value="7" required>
              days
            </span>
          </label>
          <label>
            Last watered
            <input type="date" id="plant-last-watered">
          </label>
        </div>
        <button type="submit" class="btn btn-primary">Add plant</button>
      </form>
    </section>

    <section class="plants">
      <h2>My plants</h2>
      <ul id="plant-list" class="plant-list"></ul>
      <p id="empty-state" class="empty-state">No plants yet — add your first one above! 🌱</p>
    </section>
  </main>

  <footer class="app-footer">
    <p>Your plants are saved in this browser automatically.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
