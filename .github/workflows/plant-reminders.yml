name: plant-reminders
on:
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC daily (≈ 08:00 Swedish winter, 09:00 summer — GitHub cron ignores DST)
  workflow_dispatch:
jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reminders
        run: |
          curl -fsS -X POST "$APP_URL/api/cron/reminders" \
            -H "x-cron-secret: $CRON_SECRET"
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
